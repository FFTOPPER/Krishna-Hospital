<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krishna Hospital | Receptionist Signup</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:#eaf1fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;

}

.container{

width:100%;
max-width:520px;
background:white;
padding:40px;
border-radius:28px;
box-shadow:0 18px 45px rgba(0,0,0,.08);

}

.logo{

text-align:center;
margin-bottom:18px;

}

.logo img{

width:75px;

}

h1{

color:#2f63e0;
text-align:center;
margin-bottom:6px;

}

.subtitle{

text-align:center;
color:#64748b;
margin-bottom:28px;

}

.input-group{

margin-bottom:18px;

}

label{

display:block;
margin-bottom:7px;
font-size:14px;
font-weight:600;

}

input{

width:100%;
padding:15px;
border:1px solid #d7dce5;
border-radius:12px;
font-size:15px;
outline:none;

}

input:focus{

border-color:#2f63e0;
box-shadow:0 0 0 4px rgba(47,99,224,.12);

}

button{

width:100%;
padding:16px;
background:#2f63e0;
color:white;
border:none;
border-radius:14px;
font-size:17px;
font-weight:600;
cursor:pointer;

}

button:hover{

background:#2555c5;

}

.message{

margin-top:18px;
text-align:center;
font-weight:600;

}

.footer{

margin-top:20px;
text-align:center;

}

.footer a{

color:#2f63e0;
text-decoration:none;
font-weight:600;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

<img src="assets/logo.png">

</div>

<h1>Receptionist Signup</h1>

<p class="subtitle">

Authorized Hospital Staff Registration

</p>

<form id="signupForm">

<div class="input-group">

<label>Full Name</label>

<input id="name" required>

</div>

<div class="input-group">

<label>Email</label>

<input type="email" id="email" required>

</div>

<div class="input-group">

<label>Password</label>

<input type="password" id="password" required>

</div>

<div class="input-group">

<label>Confirm Password</label>

<input type="password" id="confirmPassword" required>

</div>

<div class="input-group">

<label>Hospital Secret Registration Key</label>

<input type="password" id="secretKey" required>

</div>

<button type="submit">

Create Receptionist Account

</button>

</form>

<div id="message" class="message"></div>

<div class="footer">

Already have an account?

<a href="login.html">Login</a>

</div>

</div>

<script>
const API = "http://127.0.0.1:8000";

// Get all elements
const signupForm = document.getElementById("signupForm");
const message = document.getElementById("message");
const nameInput = document.getElementById("name");
const emailInput = document.getElementById("email");
const passwordInput = document.getElementById("password");
const confirmPasswordInput = document.getElementById("confirmPassword");
const secretKeyInput = document.getElementById("secretKey");

signupForm.addEventListener("submit", async (e) => {
    e.preventDefault();

    message.innerHTML = "";

    const fullName = nameInput.value.trim();
    const email = emailInput.value.trim();
    const password = passwordInput.value;
    const confirmPassword = confirmPasswordInput.value;
    const secretKey = secretKeyInput.value.trim();

    if (password !== confirmPassword) {
        message.innerHTML = "<span style='color:red'>Passwords do not match.</span>";
        return;
    }

    try {
        const res = await fetch(`${API}/receptionist/signup`, {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: fullName,
                email: email,
                password: password,
                secret_key: secretKey
            })
        });

        const data = await res.json();

        if (data.success) {
            message.innerHTML = "<span style='color:green'>Account created successfully.</span>";

            setTimeout(() => {
                window.location.href = "login.html";
            }, 1500);

        } else {
            message.innerHTML = `<span style="color:red">${data.message}</span>`;
        }

    } catch (err) {
        console.error(err);
        message.innerHTML = "<span style='color:red'>Server error. Make sure FastAPI is running.</span>";
    }
});
</script>

</body>
</html>
