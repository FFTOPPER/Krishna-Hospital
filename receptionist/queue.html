<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Receptionist | Patient Queue</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eef5ff;
min-height:100vh;
}

.header{
background:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.brand{
display:flex;
align-items:center;
gap:15px;
}

.brand img{
width:55px;
}

.brand h2{
color:#2f63e0;
}

.back{
background:#2f63e0;
color:white;
padding:10px 18px;
border-radius:10px;
text-decoration:none;
}

.container{
max-width:1200px;
margin:auto;
padding:30px 20px;
}

.page-title{
margin-bottom:20px;
}

.page-title h1{
color:#2f63e0;
}

.page-title p{
color:#64748b;
margin-top:6px;
}

/* FILTER BAR */

.filter-bar{
display:flex;
gap:12px;
flex-wrap:wrap;
margin-bottom:25px;
}

.filter-btn{
padding:10px 18px;
border:none;
border-radius:999px;
background:white;
color:#475569;
font-weight:600;
cursor:pointer;
box-shadow:0 6px 15px rgba(0,0,0,.05);
transition:.25s;
}

.filter-btn:hover{
background:#edf4ff;
}

.filter-btn.active{
background:#2f63e0;
color:white;
box-shadow:0 8px 18px rgba(47,99,224,.25);
}

.queue{
display:flex;
flex-direction:column;
gap:22px;
}

.card{
background:white;
border-radius:22px;
padding:24px;
box-shadow:0 12px 30px rgba(0,0,0,.06);
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
gap:10px;
}

.patient-id{
font-weight:700;
color:#2f63e0;
}

.status{
padding:8px 16px;
border-radius:999px;
font-size:13px;
font-weight:600;
}

.pending{
background:#fff7d6;
color:#c08400;
}

.confirmed{
background:#dcfce7;
color:#15803d;
}

.rejected{
background:#fee2e2;
color:#dc2626;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(260px,1fr));
gap:18px;
margin-bottom:18px;
}

.box{
background:#f8fbff;
padding:14px;
border-radius:14px;
}

.label{
font-size:12px;
color:#64748b;
margin-bottom:4px;
}

.value{
font-weight:600;
}

.appointment-box{
background:#ecfdf5;
border:1px solid #bbf7d0;
padding:15px;
border-radius:14px;
margin-bottom:18px;
}

.rejection-box{
background:#fef2f2;
border:1px solid #fecaca;
padding:15px;
border-radius:14px;
margin-bottom:18px;
}

.actions{
display:flex;
gap:12px;
flex-wrap:wrap;
}

button{
border:none;
cursor:pointer;
padding:12px 20px;
border-radius:10px;
font-weight:600;
transition:.2s;
}

.confirm{
background:#16a34a;
color:white;
}

.reject{
background:#dc2626;
color:white;
}

.disabled{
background:#cbd5e1;
cursor:not-allowed;
color:#475569;
}

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:none;
justify-content:center;
align-items:center;
padding:20px;
z-index:100;
}

.modal-box{
background:white;
padding:30px;
border-radius:20px;
width:100%;
max-width:430px;
}

.modal-box h3{
color:#2f63e0;
margin-bottom:18px;
}

.modal-box label{
display:block;
margin:10px 0 6px;
font-weight:600;
}

.modal-box input,
.modal-box textarea{
width:100%;
padding:12px;
border-radius:10px;
border:1px solid #d6dce7;
font-family:'Poppins',sans-serif;
}

.modal-box textarea{
resize:none;
}

.modal-actions{
display:flex;
gap:10px;
margin-top:22px;
}

.save{
background:#16a34a;
color:white;
}

.cancel{
background:#e5e7eb;
}

.empty{
text-align:center;
padding:60px;
color:#64748b;
}

</style>
</head>

<body>

<header class="header">

<div class="brand">
<img src="assets/logo.png">
<div>
<h2>Krishna Hospital</h2>
<small>Mental Wellness Centre</small>
</div>
</div>

<a href="dashboard.html" class="back">← Dashboard</a>

</header>

<div class="container">

<div class="page-title">
<h1>Patient Queue</h1>
<p>Manage patient registrations and appointment confirmations.</p>
</div>

<!-- FILTERS -->

<div class="filter-bar">

<button class="filter-btn active" onclick="setFilter('All',this)">All</button>

<button class="filter-btn" onclick="setFilter('Pending',this)">Pending</button>

<button class="filter-btn" onclick="setFilter('Confirmed',this)">Confirmed</button>

<button class="filter-btn" onclick="setFilter('Rejected',this)">Rejected</button>

</div>

<div id="queue" class="queue"></div>

</div>

<!-- Confirm Modal -->

<div class="modal" id="confirmModal">
<div class="modal-box">

<h3>Confirm Appointment</h3>

<label>Visit Date</label>
<input type="date" id="visitDate">

<label>Visit Time</label>
<input type="time" id="visitTime">

<div class="modal-actions">
<button class="cancel" onclick="closeConfirmModal()">Cancel</button>
<button class="save" onclick="saveConfirmation()">Confirm</button>
</div>

</div>
</div>

<!-- Reject Modal -->

<div class="modal" id="rejectModal">
<div class="modal-box">

<h3>Reject Registration</h3>

<label>Reason for Rejection</label>

<textarea id="rejectReason" rows="4"
placeholder="Enter the reason for rejection..."></textarea>

<div class="modal-actions">
<button class="cancel" onclick="closeRejectModal()">Cancel</button>
<button class="reject" onclick="submitRejection()">Reject</button>
</div>

</div>
</div>

<script>

const API="https://krishna-hospital-backend.onrender.com";

const receptionistId=localStorage.getItem("receptionist_id");

let currentRegistration=null;
let rejectRegistrationId=null;

let allRegistrations=[];
let currentFilter="All";

function setFilter(filter,btn){

currentFilter=filter;

document.querySelectorAll(".filter-btn")
.forEach(button=>button.classList.remove("active"));

btn.classList.add("active");

renderQueue();

}

async function loadQueue(){

const queue=document.getElementById("queue");

queue.innerHTML="<div class='empty'>Loading patient queue...</div>";

try{

const res=await fetch(`${API}/receptionist/queue`);

const data=await res.json();

if(!data.success||!data.registrations){

queue.innerHTML="<div class='empty'>No registrations found.</div>";

return;

}

allRegistrations=data.registrations;

renderQueue();

}catch(err){

console.error(err);

queue.innerHTML="<div class='empty'>Unable to connect to server.</div>";

}

}

function renderQueue(){

const queue=document.getElementById("queue");

let registrations=allRegistrations;

if(currentFilter!=="All"){

registrations=registrations.filter(
r=>r.status===currentFilter
);

}

if(registrations.length===0){

queue.innerHTML="<div class='empty'>No records found.</div>";

return;

}

queue.innerHTML="";

registrations.forEach(p=>{

const isConfirmed=p.status==="Confirmed";
const isRejected=p.status==="Rejected";

queue.innerHTML+=`

<div class="card">

<div class="top">

<div class="patient-id">

Patient ID : KH-${String(p.patient_id).padStart(4,"0")}

</div>

<div class="status ${p.status.toLowerCase()}">${p.status}</div>

</div>

<div class="grid">

<div class="box">
<div class="label">Child</div>
<div class="value">${p.child_name}</div>
</div>

<div class="box">
<div class="label">Parent</div>
<div class="value">${p.parent_name}</div>
</div>

<div class="box">
<div class="label">Age & Gender</div>
<div class="value">${p.age} • ${p.gender}</div>
</div>

<div class="box">
<div class="label">Referred By</div>
<div class="value">${p.referred_by||"-"}</div>
</div>

<div class="box">
<div class="label">Consultation Date</div>
<div class="value">${p.consultation_date}</div>
</div>

<div class="box">
<div class="label">Address</div>
<div class="value">${p.address||"-"}</div>
</div>

</div>

<div class="box" style="margin-bottom:18px">

<div class="label">Complaints</div>

<div class="value">${p.consultation_complaints||"-"}</div>

</div>

${isConfirmed?`

<div class="appointment-box">

<div class="label">Scheduled Visit</div>

<div class="value">

📅 ${p.visit_date||"-"} &nbsp;&nbsp; 🕒 ${p.visit_time||"-"}

</div>

</div>

`:""}

${isRejected?`

<div class="rejection-box">

<div class="label" style="color:#dc2626;">Rejection Reason</div>

<div class="value">${p.rejection_reason||"No reason provided."}</div>

</div>

`:""}

<div class="actions">

<button class="${isConfirmed||isRejected?'disabled':'confirm'}"

${isConfirmed||isRejected?'disabled':''}

onclick="openConfirmModal(${p.id})">

${isConfirmed?'Confirmed':'Confirm'}

</button>

<button class="${isConfirmed||isRejected?'disabled':'reject'}"

${isConfirmed||isRejected?'disabled':''}

onclick="openRejectModal(${p.id})">

${isRejected?'Rejected':'Reject'}

</button>

</div>

</div>

`;

});

}

function openConfirmModal(id){

currentRegistration=id;

document.getElementById("visitDate").value="";
document.getElementById("visitTime").value="";

document.getElementById("confirmModal").style.display="flex";

}

function closeConfirmModal(){

document.getElementById("confirmModal").style.display="none";

}

async function saveConfirmation(){

const visitDate=document.getElementById("visitDate").value;
const visitTime=document.getElementById("visitTime").value;

if(!visitDate||!visitTime){

alert("Please select both visit date and time.");

return;

}

const res=await fetch(`${API}/receptionist/confirm-registration`,{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({

registration_id:currentRegistration,
receptionist_id:Number(receptionistId),
visit_date:visitDate,
visit_time:visitTime

})

});

const data=await res.json();

if(data.success){

closeConfirmModal();

loadQueue();

}else{

alert(data.message);

}

}

function openRejectModal(id){

rejectRegistrationId=id;

document.getElementById("rejectReason").value="";

document.getElementById("rejectModal").style.display="flex";

}

function closeRejectModal(){

document.getElementById("rejectModal").style.display="none";

}

async function submitRejection(){

const reason=document.getElementById("rejectReason").value.trim();

if(!reason){

alert("Please enter a reason for rejection.");

return;

}

const res=await fetch(`${API}/receptionist/reject-registration`,{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({

registration_id:rejectRegistrationId,
rejection_reason:reason

})

});

const data=await res.json();

if(data.success){

closeRejectModal();

loadQueue();

}else{

alert(data.message);

}

}

loadQueue();

</script>

</body>
</html>
