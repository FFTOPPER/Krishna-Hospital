<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Doctor Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eef5ff;
min-height:100vh;
}

.header{
background:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.back{
background:#2f63e0;
color:white;
padding:10px 18px;
border-radius:10px;
text-decoration:none;
font-weight:600;
}

.container{
max-width:650px;
margin:40px auto;
padding:20px;
}

.card{
background:white;
padding:30px;
border-radius:24px;
box-shadow:0 12px 30px rgba(0,0,0,.06);
}

.profile-top{
text-align:center;
margin-bottom:25px;
}

.avatar{
width:90px;
height:90px;
border-radius:50%;
background:#2f63e0;
display:flex;
justify-content:center;
align-items:center;
color:white;
font-size:32px;
font-weight:700;
margin:auto auto 15px;
}

.profile-top h2{
color:#2f63e0;
}

.grid{
display:grid;
gap:18px;
margin-top:25px;
}

.box{
background:#f8fbff;
padding:16px;
border-radius:14px;
}

.label{
font-size:12px;
color:#64748b;
margin-bottom:5px;
}

.value{
font-weight:600;
}

.password-section{
margin-top:35px;
padding-top:30px;
border-top:1px solid #e5e7eb;
}

.password-section h3{
color:#2f63e0;
margin-bottom:18px;
}

input{
width:100%;
padding:13px;
border-radius:12px;
border:1px solid #d6dce7;
margin-bottom:15px;
}

button{
width:100%;
padding:14px;
background:#2f63e0;
color:white;
border:none;
border-radius:12px;
font-weight:600;
cursor:pointer;
}

.message{
margin-top:15px;
text-align:center;
font-size:14px;
font-weight:500;
}

.success{
color:#16a34a;
}

.error{
color:#dc2626;
}

</style>
</head>

<body>

<header class="header">

<h2 style="color:#2f63e0;">Doctor Profile</h2>

<a href="dashboard.html" class="back">← Dashboard</a>

</header>

<div class="container">

<div class="card">

<div class="profile-top">

<div class="avatar" id="avatar">D</div>

<h2 id="doctorName">Loading...</h2>

<p style="color:#64748b;">Doctor Account</p>

</div>

<div class="grid">

<div class="box">

<div class="label">Doctor ID</div>

<div class="value" id="doctorId"></div>

</div>

<div class="box">

<div class="label">Email Address</div>

<div class="value" id="doctorEmail"></div>

</div>

</div>

<div class="password-section">

<h3>Change Password</h3>

<input type="password" id="newPassword" placeholder="Enter new password">

<button onclick="changePassword()">

Update Password

</button>

<div id="message" class="message"></div>

</div>

</div>

</div>

<script>

const API="https://krishna-hospital-backend.onrender.com";

const doctorId=localStorage.getItem("doctor_id");

async function loadProfile(){

try{

const res=await fetch(`${API}/doctor/profile/${doctorId}`);

const data=await res.json();

if(!data.success) return;

const doctor=data.doctor;

document.getElementById("doctorName").innerText=doctor.name;
document.getElementById("doctorId").innerText=`DOC-${String(doctor.id).padStart(4,"0")}`;
document.getElementById("doctorEmail").innerText=doctor.email;
document.getElementById("avatar").innerText=doctor.name.charAt(0).toUpperCase();

}catch(err){

console.error(err);

}

}

async function changePassword(){

const password=document.getElementById("newPassword").value.trim();

const message=document.getElementById("message");

if(!password){

message.innerText="Enter a new password.";
message.className="message error";
return;

}

const res=await fetch(`${API}/doctor/change-password`,{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

doctor_id:Number(doctorId),

new_password:password

})

});

const data=await res.json();

message.innerText=data.message;
message.className=`message ${data.success?"success":"error"}`;

if(data.success){

document.getElementById("newPassword").value="";

}

}

loadProfile();

</script>

</body>
</html>
