<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Auto Message</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family: Arial, Helvetica, sans-serif;
        }

        body{
            height:100vh;
            display:flex;
            justify-content:center;
            align-items:center;
            background:#e9f5ec;
        }

        .container{
            background:white;
            padding:30px;
            border-radius:15px;
            box-shadow:0 8px 25px rgba(0,0,0,0.15);
            width:350px;
            text-align:center;
        }

        h2{
            color:#25D366;
            margin-bottom:20px;
        }

        input{
            width:100%;
            padding:12px;
            border:2px solid #25D366;
            border-radius:8px;
            font-size:16px;
            margin-bottom:15px;
            outline:none;
        }

        button{
            width:100%;
            padding:12px;
            border:none;
            border-radius:8px;
            background:#25D366;
            color:white;
            font-size:16px;
            cursor:pointer;
            transition:0.3s;
        }

        button:hover{
            background:#1da851;
        }

        p{
            margin-top:15px;
            color:#666;
            font-size:14px;
        }
    </style>
</head>
<body>

<div class="container">
    <h2>WhatsApp Sender</h2>

    <input type="text" id="phone" placeholder="Enter phone number (91XXXXXXXXXX)">

    <button onclick="sendWhatsApp()">Submit</button>

    <p>Enter the number with country code (e.g., 919876543210).</p>
</div>

<script>
function sendWhatsApp() {
    let phone = document.getElementById("phone").value.trim();

    // Remove spaces, +, and other non-digit characters
    phone = phone.replace(/\D/g, '');

    if(phone.length < 10){
        alert("Please enter a valid phone number with country code.");
        return;
    }

    const message = "Hi Welcome";
    const url = `https://wa.me/${phone}?text=${encodeURIComponent(message)}`;

    window.open(url, "_blank");
}
</script>

</body>
</html>
