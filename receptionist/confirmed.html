<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confirmed Appointments</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eef5ff;
min-height:100vh;
}

.header{
background:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.brand{
display:flex;
align-items:center;
gap:15px;
}

.brand img{
width:55px;
}

.brand h2{
color:#2f63e0;
}

.back{
background:#2f63e0;
color:white;
padding:10px 18px;
border-radius:10px;
text-decoration:none;
font-weight:600;
}

.container{
max-width:1200px;
margin:auto;
padding:30px 20px;
}

.page-title{
margin-bottom:25px;
}

.page-title h1{
color:#2f63e0;
}

.page-title p{
color:#64748b;
}

.list{
display:flex;
flex-direction:column;
gap:22px;
}

.card{
background:white;
padding:24px;
border-radius:22px;
box-shadow:0 12px 30px rgba(0,0,0,.06);
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
gap:10px;
}

.patient-id{
font-weight:700;
color:#2f63e0;
}

.badge{
background:#dcfce7;
color:#15803d;
padding:8px 16px;
border-radius:999px;
font-size:13px;
font-weight:600;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:18px;
margin-bottom:18px;
}

.box{
background:#f8fbff;
padding:14px;
border-radius:14px;
}

.label{
font-size:12px;
color:#64748b;
margin-bottom:4px;
}

.value{
font-weight:600;
}

.schedule{
background:#ecfdf5;
border:1px solid #bbf7d0;
padding:16px;
border-radius:16px;
margin-top:12px;
}

.schedule h4{
color:#15803d;
margin-bottom:8px;
}

.empty{
text-align:center;
padding:70px;
color:#64748b;
font-size:18px;
}

</style>

</head>

<body>

<header class="header">

<div class="brand">

<img src="assets/logo.png">

<div>

<h2>Krishna Hospital</h2>

<small>Mental Wellness Centre</small>

</div>

</div>

<a href="dashboard.html" class="back">← Dashboard</a>

</header>

<div class="container">

<div class="page-title">

<h1>Confirmed Registrations</h1>

<p>
View all patients whose appointments have been confirmed.
</p>

</div>

<div id="confirmedList" class="list"></div>

</div>

<script>
const API="https://krishna-hospital-backend.onrender.com";

async function loadConfirmed(){

const container=document.getElementById("confirmedList");

container.innerHTML="<div class='empty'>Loading confirmed appointments...</div>";

try{

const res=await fetch(`${API}/receptionist/queue`);

const data=await res.json();

if(!data.success){

container.innerHTML="<div class='empty'>Unable to load appointments.</div>";

return;

}

const confirmed=data.registrations.filter(
r=>r.status==="Confirmed"
);

if(confirmed.length===0){

container.innerHTML="<div class='empty'>No confirmed appointments available.</div>";

return;

}

container.innerHTML="";

confirmed.forEach(p=>{

container.innerHTML+=`

<div class="card">

<div class="top">

<div class="patient-id">
Patient ID : KH-${String(p.patient_id).padStart(4,"0")}
</div>

<div class="badge">Confirmed</div>

</div>

<div class="grid">

<div class="box">
<div class="label">Child Name</div>
<div class="value">${p.child_name}</div>
</div>

<div class="box">
<div class="label">Parent</div>
<div class="value">${p.parent_name}</div>
</div>

<div class="box">
<div class="label">Age & Gender</div>
<div class="value">${p.age} • ${p.gender}</div>
</div>

<div class="box">
<div class="label">Referred By</div>
<div class="value">${p.referred_by||"-"}</div>
</div>

<div class="box">
<div class="label">Consultation Date</div>
<div class="value">${p.consultation_date}</div>
</div>

<div class="box">
<div class="label">Address</div>
<div class="value">${p.address||"-"}</div>
</div>

</div>

<div class="box" style="margin-bottom:15px">

<div class="label">Consultation Complaint</div>

<div class="value">${p.consultation_complaints||"-"}</div>

</div>

<div class="schedule">

<h4>Scheduled Appointment</h4>

<p>📅 <strong>${p.visit_date}</strong></p>

<p>🕒 <strong>${p.visit_time}</strong></p>

</div>

</div>

`;

});

}catch(err){

console.error(err);

container.innerHTML="<div class='empty'>Unable to connect to server.</div>";

}

}

loadConfirmed();

</script>

</body>
</html>
