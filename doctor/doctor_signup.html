<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Doctor Signup | Krishna Hospital</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eaf1fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;
}

.card{
background:white;
width:100%;
max-width:460px;
padding:35px;
border-radius:26px;
box-shadow:0 18px 40px rgba(0,0,0,.08);
}

.logo{
text-align:center;
margin-bottom:25px;
}

.logo img{
width:80px;
margin-bottom:10px;
}

.logo h2{
color:#2f63e0;
}

.logo p{
color:#64748b;
font-size:14px;
}

.form-group{
margin-bottom:18px;
}

label{
display:block;
font-weight:600;
margin-bottom:7px;
color:#334155;
}

input{
width:100%;
padding:13px;
border:1px solid #d6dce7;
border-radius:12px;
font-size:15px;
}

input:focus{
outline:none;
border-color:#2f63e0;
box-shadow:0 0 0 3px rgba(47,99,224,.15);
}

button{
width:100%;
padding:14px;
border:none;
border-radius:12px;
background:#2f63e0;
color:white;
font-size:16px;
font-weight:600;
cursor:pointer;
transition:.25s;
}

button:hover{
background:#2553c9;
}

.error{
color:#dc2626;
font-size:14px;
margin-top:12px;
text-align:center;
}

.success{
color:#16a34a;
font-size:14px;
margin-top:12px;
text-align:center;
}

.bottom{
text-align:center;
margin-top:20px;
font-size:14px;
}

.bottom a{
color:#2f63e0;
text-decoration:none;
font-weight:600;
}

</style>
</head>

<body>

<div class="card">

<div class="logo">

<img src="assets/logo.png" alt="Hospital Logo">

<h2>Doctor Registration</h2>

<p>Create a secure doctor account</p>

</div>

<form id="signupForm">

<div class="form-group">

<label>Doctor Name</label>

<input type="text" id="name" required>

</div>

<div class="form-group">

<label>Email Address</label>

<input type="email" id="email" required>

</div>

<div class="form-group">

<label>Password</label>

<input type="password" id="password" required>

</div>

<div class="form-group">

<label>Doctor Registration Key</label>

<input type="password" id="secretKey" required>

</div>

<button type="submit">

Create Account

</button>

<div id="message"></div>

</form>

<div class="bottom">

Already have an account?

<a href="doctor_login.html">Login</a>

</div>

</div>

<script>

const API="https://krishna-hospital-backend.onrender.com";

document.getElementById("signupForm").addEventListener("submit",async(e)=>{

e.preventDefault();

const message=document.getElementById("message");

message.className="";
message.innerText="";

try{

const res=await fetch(`${API}/doctor/signup`,{

method:"POST",

headers:{

"Content-Type":"application/json"

},

body:JSON.stringify({

name:document.getElementById("name").value.trim(),

email:document.getElementById("email").value.trim(),

password:document.getElementById("password").value,

secret_key:document.getElementById("secretKey").value

})

});

const data=await res.json();

message.innerText=data.message;

message.className=data.success?"success":"error";

if(data.success){

setTimeout(()=>{

window.location.href="doctor_login.html";

},1500);

}

}catch{

message.innerText="Unable to connect to server.";

message.className="error";

}

});

</script>

</body>
</html>
