<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krishna Hospital | My Activities</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eaf1fb;
padding:25px;
}

.container{
max-width:900px;
margin:auto;
}

.header{
display:flex;
align-items:center;
gap:15px;
margin-bottom:30px;
}

.header img{
width:60px;
}

.header h1{
color:#2f63e0;
}

.card{
background:white;
padding:22px;
border-radius:18px;
box-shadow:0 10px 25px rgba(0,0,0,.06);
margin-bottom:18px;
}

.card h3{
color:#2f63e0;
margin-bottom:12px;
}

.info{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(180px,1fr));
gap:10px;
margin-bottom:12px;
}

.label{
font-size:12px;
color:#64748b;
}

.value{
font-weight:600;
}

.status{
display:inline-block;
padding:8px 16px;
border-radius:20px;
font-size:14px;
font-weight:600;
}

.Pending{
background:#FFF3CD;
color:#856404;
}

.Confirmed{
background:#D4EDDA;
color:#155724;
}

.Completed{
background:#D1ECF1;
color:#0C5460;
}

.empty{
text-align:center;
background:white;
padding:40px;
border-radius:18px;
color:#64748b;
}

.back{
margin-bottom:20px;
display:inline-block;
color:#2f63e0;
text-decoration:none;
font-weight:600;
}

</style>
</head>
<body>

<div class="container">

<a href="dashboard.html" class="back">← Back to Dashboard</a>

<div class="header">

<img src="assets/logo.png">

<div>

<h1>My Activities</h1>

<p>Your consultation registration history</p>

</div>

</div>

<div id="activityContainer"></div>

</div>

<script>

const API="http://127.0.0.1:8000";

const patient=localStorage.getItem("patient_id");

async function loadActivities(){

const container=document.getElementById("activityContainer");

try{

const res=await fetch(`${API}/my-activities/${patient}`);

const data=await res.json();

if(!data.success || data.activities.length===0){

container.innerHTML=`
<div class="empty">

<h3>No Activities Yet</h3>

<p>You haven't submitted any consultation forms yet.</p>

</div>
`;

return;

}

container.innerHTML="";

data.activities.forEach(item=>{

container.innerHTML+=`

<div class="card">

<h3>${item.child_name}</h3>

<div class="info">

<div>
<div class="label">Date</div>
<div class="value">${item.date}</div>
</div>

<div>
<div class="label">Referred By</div>
<div class="value">${item.referred_by}</div>
</div>

<div>
<div class="label">Age</div>
<div class="value">${item.age}</div>
</div>

<div>
<div class="label">Gender</div>
<div class="value">${item.gender}</div>
</div>

</div>

<span class="status ${item.status}">
${item.status}
</span>

</div>

`;

});

}catch(e){

container.innerHTML=`
<div class="empty">

Unable to load activities.

</div>
`;

}

}

loadActivities();

</script>

</body>
</html>
