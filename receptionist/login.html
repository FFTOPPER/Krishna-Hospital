<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krishna Hospital | Receptionist Login</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{

background:#eaf1fb;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
padding:20px;

}

.container{

width:100%;
max-width:450px;
background:white;
padding:40px;
border-radius:28px;
box-shadow:0 18px 45px rgba(0,0,0,.08);

}

.logo{

text-align:center;
margin-bottom:18px;

}

.logo img{

width:75px;

}

h1{

text-align:center;
color:#2f63e0;
margin-bottom:8px;

}

.subtitle{

text-align:center;
color:#64748b;
margin-bottom:28px;

}

.input-group{

margin-bottom:18px;

}

label{

display:block;
margin-bottom:7px;
font-weight:600;

}

input{

width:100%;
padding:15px;
border-radius:12px;
border:1px solid #d6dce7;
font-size:15px;

}

input:focus{

outline:none;
border-color:#2f63e0;
box-shadow:0 0 0 4px rgba(47,99,224,.12);

}

button{

width:100%;
padding:16px;
border:none;
border-radius:14px;
background:#2f63e0;
color:white;
font-size:17px;
font-weight:600;
cursor:pointer;

}

button:hover{

background:#2555c5;

}

.message{

margin-top:18px;
text-align:center;
font-weight:600;

}

.footer{

margin-top:20px;
text-align:center;

}

.footer a{

color:#2f63e0;
text-decoration:none;
font-weight:600;

}

</style>

</head>

<body>

<div class="container">

<div class="logo">

<img src="../assets/logo.png">

</div>

<h1>Receptionist Login</h1>

<p class="subtitle">

Krishna Hospital Staff Portal

</p>

<form id="loginForm">

<div class="input-group">

<label>Email</label>

<input type="email" id="email" required>

</div>

<div class="input-group">

<label>Password</label>

<input type="password" id="password" required>

</div>

<button type="submit">

Login

</button>

</form>

<div id="message" class="message"></div>

<div class="footer">

New staff?

<a href="signup.html">Create Account</a>

</div>

</div>

<script>

const API="http://127.0.0.1:8000";

loginForm.addEventListener("submit",async(e)=>{

e.preventDefault();

try{

const res=await fetch(`${API}/receptionist/login`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email:email.value.trim(),
password:password.value

})

});

const data=await res.json();

if(data.success){

localStorage.setItem("receptionist_logged_in","true");
localStorage.setItem("receptionist_id",data.receptionist_id);
localStorage.setItem("receptionist_name",data.name);

window.location.href="dashboard.html";

}else{

message.innerHTML=`<span style='color:red'>${data.message}</span>`;

}

}catch{

message.innerHTML="<span style='color:red'>Server error.</span>";

}

});

</script>

</body>
</html>
