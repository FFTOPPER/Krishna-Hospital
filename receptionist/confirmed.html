<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Confirmed Appointments | Krishna Hospital</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eef5ff;
min-height:100vh;
}

/* Header */

.header{
background:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.brand{
display:flex;
align-items:center;
gap:15px;
}

.brand img{
width:55px;
}

.brand h2{
color:#2f63e0;
}

.back{
background:#2f63e0;
color:white;
padding:10px 18px;
border-radius:10px;
text-decoration:none;
font-weight:600;
}

/* Container */

.container{
max-width:1200px;
margin:auto;
padding:30px 20px;
}

/* Title */

.title-row{
display:flex;
justify-content:space-between;
align-items:flex-start;
margin-bottom:25px;
gap:20px;
}

.page-title h1{
color:#2f63e0;
margin-bottom:8px;
}

.page-title p{
color:#64748b;
}

/* Calendar Button */

.calendar-btn{
width:52px;
height:52px;
border:none;
border-radius:16px;
background:#2f63e0;
color:white;
font-size:24px;
cursor:pointer;
display:flex;
justify-content:center;
align-items:center;
box-shadow:0 10px 25px rgba(47,99,224,.25);
transition:.25s;
}

.calendar-btn:hover{
transform:translateY(-2px);
background:#2553c9;
}

/* Back Filter */

.back-filter{
display:none;
margin-bottom:20px;
padding:12px 18px;
border:none;
border-radius:10px;
background:#2f63e0;
color:white;
font-weight:600;
cursor:pointer;
}

/* Cards */

.list{
display:flex;
flex-direction:column;
gap:22px;
}

.card{
background:white;
padding:24px;
border-radius:22px;
box-shadow:0 12px 30px rgba(0,0,0,.06);
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:20px;
flex-wrap:wrap;
gap:10px;
}

.patient-id{
font-weight:700;
color:#2f63e0;
}

.badge{
background:#dcfce7;
color:#15803d;
padding:8px 16px;
border-radius:999px;
font-size:13px;
font-weight:600;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(240px,1fr));
gap:18px;
margin-bottom:18px;
}

.box{
background:#f8fbff;
padding:14px;
border-radius:14px;
}

.label{
font-size:12px;
color:#64748b;
margin-bottom:4px;
}

.value{
font-weight:600;
}

.schedule{
background:#ecfdf5;
border:1px solid #bbf7d0;
padding:16px;
border-radius:16px;
margin-top:12px;
}

.schedule h4{
color:#15803d;
margin-bottom:8px;
}

.empty{
text-align:center;
padding:70px;
color:#64748b;
font-size:18px;
background:white;
border-radius:22px;
box-shadow:0 12px 30px rgba(0,0,0,.06);
}

/* Calendar Modal */

.modal{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:none;
justify-content:center;
align-items:center;
z-index:999;
padding:20px;
}

.calendar-card{
background:white;
width:100%;
max-width:430px;
border-radius:24px;
padding:22px;
box-shadow:0 20px 50px rgba(0,0,0,.25);
}

.cal-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:18px;
}

.cal-header button{
width:40px;
height:40px;
border:none;
border-radius:10px;
background:#eef4ff;
cursor:pointer;
font-size:18px;
}

.cal-title{
font-size:20px;
font-weight:700;
color:#2f63e0;
}

.weekdays,.days{
display:grid;
grid-template-columns:repeat(7,1fr);
text-align:center;
}

.weekdays div{
padding:10px;
font-size:13px;
font-weight:600;
color:#64748b;
}

.day{
padding:12px;
margin:3px;
border-radius:12px;
cursor:pointer;
position:relative;
transition:.2s;
}

.day:hover{
background:#eef4ff;
}

.today{
background:#2f63e0;
color:white;
font-weight:700;
}

.has-event::after{
content:"";
width:6px;
height:6px;
background:#2563eb;
border-radius:50%;
position:absolute;
bottom:6px;
left:50%;
transform:translateX(-50%);
}

.today.has-event::after{
background:white;
}

.close-btn{
margin-top:20px;
width:100%;
padding:12px;
border:none;
border-radius:12px;
background:#2f63e0;
color:white;
font-weight:600;
cursor:pointer;
}

@media(max-width:700px){

.title-row{
flex-direction:column;
align-items:flex-start;
}

}

</style>

</head>

<body>

<header class="header">

<div class="brand">

<img src="assets/logo.png">

<div>

<h2>Krishna Hospital</h2>

<small>Mental Wellness Centre</small>

</div>

</div>

<a href="dashboard.html" class="back">
← Dashboard
</a>

</header>

<div class="container">

<div class="title-row">

<div class="page-title">

<h1>Confirmed Registrations</h1>

<p>View all patients whose appointments have been confirmed.</p>

</div>

<button class="calendar-btn" onclick="openCalendar()" title="Appointment Calendar">
📅
</button>

</div>

<button id="backFilter" class="back-filter" onclick="resetFilter()">
← Back to All Confirmed Registrations
</button>

<div id="confirmedList" class="list"></div>

</div>

<!-- Calendar -->

<div class="modal" id="calendarModal">

<div class="calendar-card">

<div class="cal-header">

<button onclick="changeMonth(-1)">❮</button>

<div class="cal-title" id="monthTitle"></div>

<button onclick="changeMonth(1)">❯</button>

</div>

<div class="weekdays">
<div>Sun</div><div>Mon</div><div>Tue</div><div>Wed</div><div>Thu</div><div>Fri</div><div>Sat</div>
</div>

<div id="calendarDays" class="days"></div>

<button class="close-btn" onclick="closeCalendar()">
Close Calendar
</button>

</div>

</div>

<script>

const API="https://krishna-hospital-backend.onrender.com";

const container=document.getElementById("confirmedList");
const calendarModal=document.getElementById("calendarModal");
const calendarDays=document.getElementById("calendarDays");
const monthTitle=document.getElementById("monthTitle");
const backFilter=document.getElementById("backFilter");

let confirmedPatients=[];
let currentMonth=new Date();

/* Load */

async function loadConfirmed(){

container.innerHTML="<div class='empty'>Loading confirmed appointments...</div>";

try{

const res=await fetch(`${API}/receptionist/queue`);

const data=await res.json();

confirmedPatients=data.registrations.filter(r=>r.status==="Confirmed");

render(confirmedPatients);

generateCalendar();

}catch(err){

container.innerHTML="<div class='empty'>Unable to connect to server.</div>";

}

}

/* Render */

function render(list){

container.innerHTML="";

if(list.length===0){

container.innerHTML="<div class='empty'>No appointments found for this date.</div>";

return;

}

list.forEach(p=>{

container.innerHTML+=`

<div class="card">

<div class="top">

<div class="patient-id">
Patient ID : KH-${String(p.patient_id).padStart(4,"0")}
</div>

<div class="badge">Confirmed</div>

</div>

<div class="grid">

<div class="box">
<div class="label">Child Name</div>
<div class="value">${p.child_name}</div>
</div>

<div class="box">
<div class="label">Parent</div>
<div class="value">${p.parent_name}</div>
</div>

<div class="box">
<div class="label">Age & Gender</div>
<div class="value">${p.age} • ${p.gender}</div>
</div>

<div class="box">
<div class="label">Referred By</div>
<div class="value">${p.referred_by || "-"}</div>
</div>

<div class="box">
<div class="label">Consultation Date</div>
<div class="value">${p.consultation_date || "-"}</div>
</div>

<div class="box">
<div class="label">Address</div>
<div class="value">${p.address || "-"}</div>
</div>

</div>

<div class="box" style="margin-bottom:15px">
<div class="label">Consultation Complaint</div>
<div class="value">${p.consultation_complaints || "-"}</div>
</div>

<div class="schedule">

<h4>Scheduled Appointment</h4>

<p>📅 <strong>${p.visit_date || "-"}</strong></p>

<p>🕒 <strong>${p.visit_time || "-"}</strong></p>

<p>👨‍⚕️ <strong>${p.doctor_name || "-"}</strong></p>

</div>

</div>

`;

});

}

/* Calendar */

function openCalendar(){

calendarModal.style.display="flex";

}

function closeCalendar(){

calendarModal.style.display="none";

}

function changeMonth(step){

currentMonth.setMonth(currentMonth.getMonth()+step);

generateCalendar();

}

function generateCalendar(){

calendarDays.innerHTML="";

const year=currentMonth.getFullYear();
const month=currentMonth.getMonth();

monthTitle.innerText=currentMonth.toLocaleString("default",{month:"long",year:"numeric"});

const firstDay=new Date(year,month,1).getDay();
const daysInMonth=new Date(year,month+1,0).getDate();

for(let i=0;i<firstDay;i++){

calendarDays.innerHTML+="<div></div>";

}

const today=new Date().toISOString().split("T")[0];

for(let d=1;d<=daysInMonth;d++){

const full=`${year}-${String(month+1).padStart(2,"0")}-${String(d).padStart(2,"0")}`;

const hasEvent=confirmedPatients.some(p=>p.visit_date===full);

calendarDays.innerHTML+=`
<div class="day ${full===today?"today":""} ${hasEvent?"has-event":""}"
onclick="filterDate('${full}')">${d}</div>`;

}

}

/* Filter */

function filterDate(date){

const filtered=confirmedPatients.filter(p=>p.visit_date===date);

render(filtered);

backFilter.style.display="inline-block";

closeCalendar();

}

function resetFilter(){

backFilter.style.display="none";

render(confirmedPatients);

}

loadConfirmed();

</script>

</body>
</html>
