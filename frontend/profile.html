<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Krishna Hospital | Profile</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eaf1fb;
min-height:100vh;
padding:30px;
}

.container{
max-width:700px;
margin:auto;
}

.back{
display:inline-block;
margin-bottom:20px;
color:#2f63e0;
text-decoration:none;
font-weight:600;
}

.card{
background:white;
border-radius:28px;
padding:35px;
box-shadow:0 15px 35px rgba(0,0,0,.08);
}

.header{
text-align:center;
margin-bottom:35px;
}

.logo{
width:70px;
margin-bottom:10px;
}

.header h1{
color:#2f63e0;
font-size:30px;
}

.header p{
color:#64748b;
}

.profile-area{
display:flex;
flex-direction:column;
align-items:center;
margin-bottom:35px;
}

.avatar-wrap{
position:relative;
width:150px;
height:150px;
}

.avatar{
width:150px;
height:150px;
border-radius:50%;
border:5px solid #2f63e0;
overflow:hidden;
background:#eef3ff;
display:flex;
justify-content:center;
align-items:center;
}

.avatar img{
width:100%;
height:100%;
object-fit:cover;
display:none;
}

.placeholder{
font-size:60px;
color:#2f63e0;
}

.edit-btn{
position:absolute;
right:0;
bottom:0;
width:42px;
height:42px;
border-radius:50%;
border:none;
background:#2f63e0;
color:white;
cursor:pointer;
font-size:18px;
box-shadow:0 5px 12px rgba(0,0,0,.2);
}

.delete-btn{
margin-top:12px;
border:none;
background:none;
color:#dc2626;
cursor:pointer;
font-size:14px;
}

.details{
display:flex;
flex-direction:column;
gap:18px;
}

.box{
background:#f7f9fc;
padding:16px;
border-radius:16px;
}

.label{
font-size:12px;
color:#64748b;
margin-bottom:4px;
}

.value{
font-weight:600;
color:#1f2937;
word-break:break-word;
}

.password-box{
margin-top:30px;
}

.password-box h3{
color:#2f63e0;
margin-bottom:15px;
}

input{
width:100%;
padding:14px;
border-radius:12px;
border:1px solid #d6dce7;
margin-bottom:12px;
outline:none;
}

input:focus{
border-color:#2f63e0;
box-shadow:0 0 0 4px rgba(47,99,224,.12);
}

.primary-btn{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:#2f63e0;
color:white;
font-size:16px;
cursor:pointer;
margin-top:8px;
}

.primary-btn:hover{
background:#2454c7;
}

.logout{
width:100%;
padding:15px;
border:none;
border-radius:14px;
background:#e53935;
color:white;
font-size:16px;
cursor:pointer;
margin-top:18px;
}

.logout:hover{
background:#d32f2f;
}

.message{
margin-top:15px;
text-align:center;
font-weight:600;
}

.success{
color:#16a34a;
}

.error{
color:#dc2626;
}

</style>
</head>

<body>

<div class="container">

<a href="dashboard.html" class="back">← Back to Dashboard</a>

<div class="card">

<div class="header">

<img src="assets/logo.png" class="logo">

<h1>Patient Profile</h1>

<p>Krishna Hospital Mental Wellness Centre</p>

</div>

<div class="profile-area">

<div class="avatar-wrap">

<div class="avatar">

<img id="profileImage">

<div class="placeholder" id="placeholder">👤</div>

</div>

<button class="edit-btn"
onclick="document.getElementById('photoInput').click()">
✏️
</button>

</div>

<input type="file"
id="photoInput"
accept="image/*"
hidden>

<button class="delete-btn"
onclick="removePhoto()">
Remove Photo
</button>

</div>

<div class="details">

<div class="box">
<div class="label">Patient ID</div>
<div class="value" id="patientId">Loading...</div>
</div>

<div class="box">
<div class="label">Email / Phone</div>
<div class="value" id="patientEmail">Loading...</div>
</div>

</div>

<div class="password-box">

<h3>Change Password</h3>

<input type="password"
id="newPassword"
placeholder="New Password">

<input type="password"
id="confirmPassword"
placeholder="Confirm Password">

<button class="primary-btn"
onclick="changePassword()">
Update Password
</button>

</div>

<div id="message" class="message"></div>

<button class="logout"
onclick="logout()">
Logout
</button>

</div>

</div>

<script>

const API="https://krishna-hospital-backend.onrender.com";

const patientLogin=localStorage.getItem("patient_id");

const profileImage=document.getElementById("profileImage");
const placeholder=document.getElementById("placeholder");
const message=document.getElementById("message");

async function loadProfile(){

try{

const res=await fetch(`${API}/patient-profile/${patientLogin}`);

const data=await res.json();

if(!data.success){

message.className="message error";
message.innerText=data.message;
return;

}

document.getElementById("patientId").innerText=data.patient.id;
document.getElementById("patientEmail").innerText=data.patient.email_or_phone;

if(data.patient.profile_picture){

profileImage.src=data.patient.profile_picture;
profileImage.style.display="block";
placeholder.style.display="none";

}

}catch(err){

message.className="message error";
message.innerText="Unable to load profile.";

}

}

document.getElementById("photoInput")
.addEventListener("change",async(e)=>{

const file=e.target.files[0];

if(!file) return;

const reader=new FileReader();

reader.onload=async()=>{

const base64=reader.result;

await fetch(`${API}/upload-profile-photo`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email_or_phone:patientLogin,

profile_picture:base64

})

});

loadProfile();

};

reader.readAsDataURL(file);

});

async function removePhoto(){

await fetch(`${API}/remove-profile-photo`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email_or_phone:patientLogin

})

});

profileImage.style.display="none";
placeholder.style.display="block";

loadProfile();

}

async function changePassword(){

const newPass=document.getElementById("newPassword").value;
const confirm=document.getElementById("confirmPassword").value;

if(newPass!==confirm){

message.className="message error";
message.innerText="Passwords do not match.";

return;

}

const res=await fetch(`${API}/change-password`,{

method:"POST",

headers:{
"Content-Type":"application/json"
},

body:JSON.stringify({

email_or_phone:patientLogin,

new_password:newPass

})

});

const data=await res.json();

message.className=data.success?"message success":"message error";
message.innerText=data.message;

}

function logout(){

localStorage.removeItem("patient_id");
window.location.href="login.html";

}

loadProfile();

</script>

</body>
</html>
