<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Krishna Hospital | Registration Status</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#eef5ff;
min-height:100vh;
}

.header{
background:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 15px rgba(0,0,0,.08);
}

.brand{
display:flex;
align-items:center;
gap:15px;
}

.brand img{
width:55px;
}

.brand h2{
color:#2f63e0;
}

.back{
background:#2f63e0;
color:white;
padding:10px 18px;
border-radius:10px;
text-decoration:none;
}

.container{
max-width:1100px;
margin:auto;
padding:30px 20px;
}

.page-title{
margin-bottom:25px;
}

.page-title h1{
color:#2f63e0;
margin-bottom:8px;
}

.page-title p{
color:#64748b;
}

.list{
display:flex;
flex-direction:column;
gap:22px;
}

.card{
background:white;
border-radius:22px;
padding:24px;
box-shadow:0 12px 30px rgba(0,0,0,.06);
}

.top{
display:flex;
justify-content:space-between;
align-items:center;
flex-wrap:wrap;
gap:12px;
margin-bottom:20px;
}

.form-id{
font-weight:700;
color:#2f63e0;
font-size:18px;
}

.status{
padding:8px 16px;
border-radius:999px;
font-size:13px;
font-weight:600;
}

.pending{
background:#fff7d6;
color:#c08400;
}

.confirmed{
background:#dcfce7;
color:#15803d;
}

.rejected{
background:#fee2e2;
color:#dc2626;
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
margin-bottom:18px;
}

.box{
background:#f8fbff;
padding:14px;
border-radius:14px;
}

.label{
font-size:12px;
color:#64748b;
margin-bottom:4px;
}

.value{
font-weight:600;
}

.confirm-box{
background:#ecfdf5;
border:1px solid #bbf7d0;
padding:16px;
border-radius:14px;
margin-top:12px;
}

.reject-box{
background:#fef2f2;
border:1px solid #fecaca;
padding:16px;
border-radius:14px;
margin-top:12px;
}

.empty{
text-align:center;
padding:60px;
color:#64748b;
}

</style>
</head>

<body>

<header class="header">

<div class="brand">
<img src="assets/logo.png">
<div>
<h2>Krishna Hospital</h2>
<small>Mental Wellness Centre</small>
</div>
</div>

<a href="dashboard.html" class="back">← Dashboard</a>

</header>

<div class="container">

<div class="page-title">
<h1>Registration Status</h1>
<p>Track all your submitted consultation registrations.</p>
</div>

<div id="statusList" class="list"></div>

</div>

<script>

const API="http://127.0.0.1:8000";

const patientId=localStorage.getItem("patient_numeric_id");

if(!patientId){

alert("Please login first.");

window.location.href="login.html";

}

async function loadStatuses(){

const list=document.getElementById("statusList");

list.innerHTML="<div class='empty'>Loading registrations...</div>";

try{

const res=await fetch(`${API}/patient/registration-status/${patientId}`);

const data=await res.json();

if(!data.success||data.registrations.length===0){

list.innerHTML="<div class='empty'>No registrations found.</div>";

return;

}

list.innerHTML="";

data.registrations.forEach(r=>{

list.innerHTML+=`

<div class="card">

<div class="top">

<div class="form-id">

Registration #${r.registration_id}

</div>

<div class="status ${r.status.toLowerCase()}">

${r.status}

</div>

</div>

<div class="grid">

<div class="box">

<div class="label">Child Name</div>

<div class="value">${r.child_name}</div>

</div>

<div class="box">

<div class="label">Parent Name</div>

<div class="value">${r.parent_name}</div>

</div>

<div class="box">

<div class="label">Submitted Date</div>

<div class="value">${r.consultation_date}</div>

</div>

</div>

${r.status==="Confirmed"?`

<div class="confirm-box">

<div class="label">Appointment Scheduled</div>

<div class="value">

📅 ${r.visit_date}

&nbsp;&nbsp;

🕒 ${r.visit_time}

</div>

</div>

`:""}

${r.status==="Rejected"?`

<div class="reject-box">

<div class="label" style="color:#dc2626;">

Reason for Rejection

</div>

<div class="value">

${r.rejection_reason||"No reason provided."}

</div>

</div>

`:""}

${r.status==="Pending"?`

<div class="box" style="background:#fff7d6;border:1px solid #fde68a;margin-top:12px;">

<div class="label">Current Status</div>

<div class="value" style="color:#c08400;">

Your registration is under review.

</div>

</div>

`:""}

</div>

`;

});

}catch(err){

console.error(err);

list.innerHTML="<div class='empty'>Unable to connect to server.</div>";

}

}

loadStatuses();

</script>

</body>
</html>
