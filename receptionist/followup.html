<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Follow-up Scheduler</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Poppins,sans-serif;
}

body{
background:#eef5ff;
}

.header{
background:white;
padding:18px 30px;
display:flex;
justify-content:space-between;
align-items:center;
box-shadow:0 4px 12px rgba(0,0,0,.08);
}

.header a{
background:#2f63e0;
color:white;
padding:10px 18px;
border-radius:10px;
text-decoration:none;
font-weight:600;
}

.container{
max-width:1100px;
margin:auto;
padding:30px;
}

.title-row{
display:flex;
justify-content:space-between;
align-items:flex-start;
gap:20px;
margin-bottom:25px;
flex-wrap:wrap;
}

.title h1{
color:#2f63e0;
margin-bottom:6px;
}

.title p{
color:#475569;
}

.calendar-btn{
width:54px;
height:54px;
border:none;
border-radius:16px;
background:white;
box-shadow:0 8px 20px rgba(47,99,224,.15);
cursor:pointer;
display:none;
align-items:center;
justify-content:center;
font-size:26px;
transition:.25s;
}

.calendar-btn:hover{
transform:translateY(-2px);
background:#2f63e0;
color:white;
}

.filters{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:25px;
}

.filter-btn{
padding:10px 18px;
border:none;
border-radius:25px;
cursor:pointer;
background:white;
color:#2f63e0;
font-weight:600;
box-shadow:0 3px 8px rgba(0,0,0,.08);
}

.filter-btn.active{
background:#2f63e0;
color:white;
}

.list{
display:flex;
flex-direction:column;
gap:22px;
}

.card{
background:white;
padding:24px;
border-radius:20px;
box-shadow:0 10px 25px rgba(0,0,0,.06);
}

.grid{
display:grid;
grid-template-columns:repeat(auto-fit,minmax(220px,1fr));
gap:18px;
margin:20px 0;
}

.box{
background:#f8fbff;
padding:14px;
border-radius:12px;
}

.label{
font-size:12px;
color:#64748b;
}

.value{
font-weight:600;
margin-top:4px;
}

.status{
display:inline-block;
padding:8px 16px;
border-radius:999px;
font-size:13px;
font-weight:600;
margin-bottom:15px;
}

.new{
background:#fff7d6;
color:#c08400;
}

.attended{
background:#dcfce7;
color:#15803d;
}

.notattended{
background:#fee2e2;
color:#dc2626;
}

.followup-box{
background:#ecfdf5;
border:1px solid #bbf7d0;
padding:16px;
border-radius:14px;
margin-bottom:18px;
}

.actions{
display:flex;
gap:12px;
flex-wrap:wrap;
}

button.action{
padding:12px 20px;
border:none;
border-radius:10px;
cursor:pointer;
font-weight:600;
}

.btn-attended{
background:#16a34a;
color:white;
}

.btn-not{
background:#dc2626;
color:white;
}

.disabled{
background:#cbd5e1;
cursor:not-allowed;
color:#475569;
}

.modal{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:rgba(0,0,0,.45);
z-index:100;
}

.modal-box{
background:white;
padding:28px;
border-radius:18px;
width:95%;
max-width:430px;
}

.modal-box h3{
color:#2f63e0;
margin-bottom:18px;
}

.modal-box label{
display:block;
margin:10px 0 6px;
font-weight:600;
}

.modal-box input{
width:100%;
padding:12px;
border:1px solid #d6dce7;
border-radius:10px;
}

.modal-actions{
display:flex;
gap:10px;
margin-top:20px;
}

.save{
background:#16a34a;
color:white;
}

.cancel{
background:#e5e7eb;
}

.empty{
text-align:center;
padding:60px;
color:#64748b;
}

/* ================= Calendar ================= */

.calendar-modal{
position:fixed;
inset:0;
display:none;
justify-content:center;
align-items:center;
background:rgba(15,23,42,.45);
backdrop-filter:blur(6px);
z-index:300;
}

.calendar-box{
background:white;
width:95%;
max-width:470px;
padding:24px;
border-radius:28px;
box-shadow:0 25px 60px rgba(0,0,0,.25);
animation:calendarOpen .22s ease;
}

@keyframes calendarOpen{
from{
opacity:0;
transform:translateY(20px) scale(.96);
}
to{
opacity:1;
transform:translateY(0) scale(1);
}
}

.calendar-header{
display:flex;
justify-content:space-between;
align-items:center;
margin-bottom:22px;
}

.calendar-header h3{
font-size:24px;
color:#2f63e0;
font-weight:700;
}

.nav-btn{
width:46px;
height:46px;
border:none;
border-radius:14px;
background:#eef5ff;
cursor:pointer;
font-size:22px;
font-weight:700;
transition:.2s;
}

.nav-btn:hover{
background:#2f63e0;
color:white;
}

.calendar-grid{
display:grid;
grid-template-columns:repeat(7,minmax(0,1fr));
gap:10px;
}

.day-name{
text-align:center;
font-size:13px;
font-weight:600;
color:#64748b;
padding-bottom:8px;
}

.day{
aspect-ratio:1;
border:none;
border-radius:16px;
background:#f8fbff;
cursor:pointer;
font-weight:600;
font-size:15px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
transition:.2s;
position:relative;
}

.day:hover{
background:#dbeafe;
}

.day.today{
background:#2f63e0;
color:white;
}

.day.selected{
background:#16a34a;
color:white;
}

.day.empty{
visibility:hidden;
}

.day .dot{
width:6px;
height:6px;
border-radius:50%;
background:#16a34a;
margin-top:4px;
}

.day.today .dot,
.day.selected .dot{
background:white;
}

.calendar-footer{
display:flex;
justify-content:space-between;
margin-top:24px;
}

.calendar-footer button{
padding:12px 20px;
border:none;
border-radius:12px;
cursor:pointer;
font-weight:600;
}

.show-all{
background:#e5e7eb;
}

.close-cal{
background:#2f63e0;
color:white;
}

@media(max-width:700px){

.container{
padding:20px;
}

.title-row{
flex-direction:column;
align-items:flex-start;
}

.calendar-btn{
align-self:flex-end;
}

}

</style>
</head>

<body>

<header class="header">

<h2 style="color:#2f63e0">Follow-up Scheduler</h2>

<a href="dashboard.html">← Dashboard</a>

</header>

<div class="container">

<div class="title-row">

<div class="title">

<h1>Follow-up Management</h1>

<p>Record attendance and schedule future consultations.</p>

</div>

<button id="calendarButton" class="calendar-btn" onclick="openCalendar()">
📅
</button>

</div>

<div class="filters">

<button class="filter-btn active" onclick="setFilter('new',this)">
New Follow-up
</button>

<button class="filter-btn" onclick="setFilter('attended',this)">
Follow-up Scheduled
</button>

<button class="filter-btn" onclick="setFilter('notattended',this)">
Did Not Attend
</button>

<button class="filter-btn" onclick="setFilter('all',this)">
All
</button>

</div>

<div id="patientList" class="list"></div>

</div>

<!-- Calendar -->

<div class="calendar-modal" id="calendarModal">

<div class="calendar-box">

<div class="calendar-header">

<button class="nav-btn" onclick="changeMonth(-1)">‹</button>

<h3 id="calendarTitle"></h3>

<button class="nav-btn" onclick="changeMonth(1)">›</button>

</div>

<div class="calendar-grid" id="calendarGrid"></div>

<div class="calendar-footer">

<button class="show-all" onclick="clearDateFilter()">Show All</button>

<button class="close-cal" onclick="closeCalendar()">Close</button>

</div>

</div>

</div>

<!-- Follow-up Modal -->

<div class="modal" id="modal">

<div class="modal-box">

<h3>Schedule Follow-up</h3>

<label>Follow-up Date</label>

<input type="date" id="followDate">

<label>Follow-up Time</label>

<input type="time" id="followTime">

<label>Doctor to Meet</label>

<select id="doctorName" style="width:100%;padding:12px;border:1px solid #d6dce7;border-radius:10px;font-family:Poppins,sans-serif;">
<option value="">Select Doctor</option>
<option value="Dr. Janani">Dr. Janani</option>
<option value="Ms. Anitha (Psychologist)">Ms. Anitha (Psychologist)</option>
<option value="Mrs. Shagana (Psychologist)">Mrs. Shagana (Psychologist)</option>
<option value="Mrs. Shiny (Psychologist)">Mrs. Shiny (Psychologist)</option>
<option value="Mrs. Briscillal (Speech Therapist)">Mrs. Briscillal (Speech Therapist)</option>
</select>

<div class="modal-actions">

<button class="cancel" onclick="closeModal()">Cancel</button>

<button class="save" onclick="saveFollowup()">Save</button>

</div>

</div>

</div>

<script>

const API="https://krishna-hospital-backend.onrender.com";

const receptionistId=localStorage.getItem("receptionist_id");

let currentRegistration=null;
let patients=[];
let currentFilter="new";
let selectedDate=null;

const today=new Date();
let currentMonth=today.getMonth();
let currentYear=today.getFullYear();

async function loadPatients(){

const list=document.getElementById("patientList");

list.innerHTML="<div class='empty'>Loading...</div>";

try{

const res=await fetch(`${API}/receptionist/followup-list`);

const data=await res.json();

if(!data.success){

list.innerHTML="<div class='empty'>Unable to load.</div>";

return;

}

patients=data.patients;

renderPatients();

}catch{

list.innerHTML="<div class='empty'>Server error.</div>";

}

}

function setFilter(filter,btn){

currentFilter=filter;

document.querySelectorAll(".filter-btn")
.forEach(button=>button.classList.remove("active"));

btn.classList.add("active");

const calendar=document.getElementById("calendarButton");

if(filter==="attended"){

calendar.style.display="flex";

}else{

calendar.style.display="none";

selectedDate=null;

closeCalendar();

}

renderPatients();

}

function renderPatients(){

const list=document.getElementById("patientList");

let filtered=[...patients];

filtered.sort((a,b)=>{

const priority=statusPriority(a.attendance_status)-statusPriority(b.attendance_status);

if(priority!==0) return priority;

return b.registration_id-a.registration_id;

});

filtered=filtered.filter(patient=>{

if(currentFilter==="all") return true;

if(currentFilter==="new")
return !patient.attendance_status;

if(currentFilter==="attended")
return patient.attendance_status==="Attended";

if(currentFilter==="notattended")
return patient.attendance_status==="Did Not Attend";

});

if(currentFilter==="attended" && selectedDate){

filtered=filtered.filter(patient=>
patient.followup_date===selectedDate
);

}

if(filtered.length===0){

list.innerHTML="<div class='empty'>No records available.</div>";

return;

}

list.innerHTML="";

filtered.forEach(patient=>{

const statusClass=
!patient.attendance_status?"new":
patient.attendance_status==="Attended"?"attended":"notattended";

const statusText=
!patient.attendance_status?"New Follow-up":
patient.attendance_status;

list.innerHTML+=`

<div class="card">

<div class="status ${statusClass}">
${statusText}
</div>

<h3 style="color:#2f63e0">
KH-${String(patient.patient_id).padStart(4,"0")}
</h3>

<div class="grid">

<div class="box">
<div class="label">Child</div>
<div class="value">${patient.child_name}</div>
</div>

<div class="box">
<div class="label">Parent</div>
<div class="value">${patient.parent_name}</div>
</div>

<div class="box">
<div class="label">Phone Number</div>
<div class="value">${patient.phone_number||"-"}</div>
</div>

<div class="box">
<div class="label">Appointment Date</div>
<div class="value">${patient.visit_date}</div>
</div>

<div class="box">
<div class="label">Appointment Time</div>
<div class="value">${patient.visit_time}</div>
</div>

<div class="box">
<div class="label">Doctor</div>
<div class="value">${patient.doctor_name||"-"}</div>
</div>

</div>

${patient.attendance_status==="Attended"?`

<div class="followup-box">

<div class="grid">

<div class="box">
<div class="label">Next Follow-up Date</div>
<div class="value">${patient.followup_date||"-"}</div>
</div>

<div class="box">
<div class="label">Next Follow-up Time</div>
<div class="value">${patient.followup_time||"-"}</div>
</div>

<div class="box">
<div class="label">Doctor</div>
<div class="value">${patient.doctor_name||"-"}</div>
</div>

</div>

</div>

`:""}

<div class="actions">

<button class="action ${patient.attendance_status?'disabled':'btn-attended'}"

${patient.attendance_status?'disabled':''}

onclick="openModal(${patient.registration_id})">

Attended

</button>

<button class="action ${patient.attendance_status?'disabled':'btn-not'}"

${patient.attendance_status?'disabled':''}

onclick="markNotAttended(${patient.registration_id})">

Did Not Attend

</button>

</div>

</div>

`;

});

}

function statusPriority(status){

if(!status) return 0;

if(status==="Attended") return 1;

return 2;

}

/* Calendar */

function openCalendar(){

if(currentFilter!=="attended") return;

calendarModal.style.display="flex";

renderCalendar();

}

function closeCalendar(){

calendarModal.style.display="none";

}

function renderCalendar(){
// updated professional grid

const grid=document.getElementById("calendarGrid");
const title=document.getElementById("calendarTitle");

grid.innerHTML="";

const months=[
"January","February","March","April","May","June",
"July","August","September","October","November","December"
];

title.innerText=`${months[currentMonth]} ${currentYear}`;

["Sun","Mon","Tue","Wed","Thu","Fri","Sat"].forEach(day=>{

grid.innerHTML+=`<div class="day-name">${day}</div>`;

});

const firstDay=new Date(currentYear,currentMonth,1).getDay();
const daysInMonth=new Date(currentYear,currentMonth+1,0).getDate();

const followupDates=new Set(
patients
.filter(p=>p.attendance_status==="Attended" && p.followup_date)
.map(p=>p.followup_date)
);

for(let i=0;i<firstDay;i++){

grid.innerHTML+=`<div class="day empty"></div>`;

}

for(let day=1;day<=daysInMonth;day++){

const dateString=`${currentYear}-${String(currentMonth+1).padStart(2,"0")}-${String(day).padStart(2,"0")}`;

let cls="day";

const todayString=`${today.getFullYear()}-${String(today.getMonth()+1).padStart(2,"0")}-${String(today.getDate()).padStart(2,"0")}`;

if(dateString===todayString)
cls+=" today";

if(selectedDate===dateString)
cls+=" selected";

const dot=followupDates.has(dateString)
? `<span class="dot"></span>`
: "";

grid.innerHTML+=`
<button class="${cls}" onclick="selectDate('${dateString}')">
<span>${day}</span>
${dot}
</button>
`;

}

}

function changeMonth(step){

currentMonth+=step;

if(currentMonth<0){

currentMonth=11;
currentYear--;

}

if(currentMonth>11){

currentMonth=0;
currentYear++;

}

renderCalendar();

}

function selectDate(date){

selectedDate=date;

closeCalendar();

renderPatients();

}

function clearDateFilter(){

selectedDate=null;

closeCalendar();

renderPatients();

}

/* Follow-up */

function openModal(id){

currentRegistration=id;

followDate.value="";
followTime.value="";
doctorName.value="";

modal.style.display="flex";

}

function closeModal(){

modal.style.display="none";

}

async function saveFollowup(){

if(!followDate.value||!followTime.value||!doctorName.value.trim()){

alert("Please complete all fields.");

return;

}

const res=await fetch(`${API}/receptionist/followup`,{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({

registration_id:currentRegistration,
receptionist_id:Number(receptionistId),
attendance_status:"Attended",
followup_date:followDate.value,
followup_time:followTime.value,
doctor_name:doctorName.value

})

});

const data=await res.json();

if(data.success){

const patient=patients.find(p=>p.registration_id===currentRegistration);

if(patient){

patient.attendance_status="Attended";
patient.followup_date=followDate.value;
patient.followup_time=followTime.value;
patient.doctor_name=doctorName.value;

}

closeModal();

renderPatients();

}

}

async function markNotAttended(id){

if(!confirm("Mark this patient as Did Not Attend?")) return;

const res=await fetch(`${API}/receptionist/followup`,{

method:"POST",

headers:{"Content-Type":"application/json"},

body:JSON.stringify({

registration_id:id,
receptionist_id:Number(receptionistId),
attendance_status:"Did Not Attend"

})

});

const data=await res.json();

if(data.success){

const patient=patients.find(p=>p.registration_id===id);

if(patient){

patient.attendance_status="Did Not Attend";

}

renderPatients();

}

}

loadPatients();

</script>

</body>
</html>
